<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecionando...</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6093042869053002"
     crossorigin="anonymous"></script>
  <noscript><meta http-equiv="refresh" content="2;url=/portfolio"></noscript>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
    }
    #count { font-size: 4rem; font-weight: bold; margin-top: 1rem; }
  </style>
</head>
<body>
  <p>Você está sendo redirecionado...</p>
  <div id="count">2</div>

  <script>
    let seconds = 2;
    const el = document.getElementById("count");
    const timer = setInterval(() => {
      seconds--;
      el.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "/portfolio";
      }
    }, 1000);
  </script>
</body>
</html>
